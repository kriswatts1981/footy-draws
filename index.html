<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tweed Coast Tigers – U15 Boys 2026</title>
<meta name="description" content="Season draw for Tweed Coast Tigers U15 Boys – SEQJ 2026">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a1a1a">
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f7f7f7;
  --card: #ffffff;
  --text: #1a1a1a;
  --text2: #555;
  --text3: #888;
  --border: #e0e0e0;
  --gold: #FFC629;
  --gold-light: #FFD54F;
  --gold-pale: #FFF8E1;
  --black: #1a1a1a;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}

/* ── Header ── */
.header {
  position: sticky; top: 0; z-index: 100;
  background: var(--black);
  box-shadow: 0 4px 16px rgba(0,0,0,0.3);
}
.header-top {
  position: relative;
  padding: 18px 20px 14px;
  background:
    repeating-linear-gradient(
      -55deg,
      var(--gold) 0px,
      var(--gold) 18px,
      var(--gold-light) 18px,
      var(--gold-light) 36px
    );
  text-align: center;
}
.header h1 {
  font-size: 22px; font-weight: 900; color: var(--black);
  letter-spacing: 1px; text-transform: uppercase;
  text-shadow: 0 1px 0 rgba(255,255,255,0.3);
  position: relative;
}
.header .sub {
  font-size: 11px; font-weight: 700; color: rgba(0,0,0,0.5);
  text-transform: uppercase; letter-spacing: 1px;
  position: relative; margin-top: 2px;
}
.tabs {
  display: flex; gap: 0;
  background: var(--black);
}
.tab {
  flex: 1; text-align: center;
  padding: 12px 16px;
  font-size: 13px; font-weight: 700;
  color: rgba(255,255,255,0.35);
  cursor: pointer;
  border-bottom: 3px solid transparent;
  transition: all 0.2s;
  user-select: none;
  text-transform: uppercase;
  letter-spacing: 0.3px;
}
.tab.active {
  color: var(--gold);
  border-bottom-color: var(--gold);
}
.tab:hover { color: rgba(255,255,255,0.6); }

/* ── Next game banner ── */
.next-banner {
  position: relative;
  background: var(--black);
  color: #fff;
  padding: 14px 20px;
  font-size: 13px;
  line-height: 1.5;
  border-bottom: 3px solid var(--gold);
}
.next-banner .label {
  font-size: 10px; font-weight: 800; text-transform: uppercase;
  letter-spacing: 1px; color: var(--gold); margin-bottom: 4px;
}
.next-banner .detail { font-weight: 800; font-size: 16px; }
.next-banner .meta { font-size: 12px; opacity: 0.6; margin-top: 2px; }

/* ── Filter bar ── */
.filter-bar {
  max-width: 500px; margin: 0 auto;
  padding: 12px 12px 0;
  display: flex; align-items: center; gap: 10px;
}
.tct-toggle {
  display: flex; align-items: center; gap: 8px;
  font-size: 12px; font-weight: 700; color: var(--text2);
  cursor: pointer; user-select: none;
  background: #fff; border: 2px solid var(--border);
  padding: 7px 14px; border-radius: 20px;
  transition: all 0.2s;
}
.tct-toggle.active {
  background: var(--gold); border-color: var(--gold); color: var(--black);
}
.tct-toggle .dot {
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--gold); border: 2px solid var(--black);
}

/* ── Content ── */
.content { max-width: 500px; margin: 0 auto; padding: 0 12px 40px; }
.round-header { padding: 20px 8px 8px; }
.round-header h2 { font-size: 22px; font-weight: 900; color: var(--black); }
.round-header .date { font-size: 13px; color: var(--text2); margin-top: 2px; }

/* ── Match cards ── */
.match-card {
  background: var(--card);
  border-radius: 14px;
  padding: 18px;
  margin-bottom: 12px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  border-left: 5px solid transparent;
  transition: all 0.2s;
}
.match-card.tct-game {
  border-left-color: var(--gold);
  background: linear-gradient(135deg, var(--gold-pale) 0%, #fff 50%);
  box-shadow: 0 2px 12px rgba(255,198,41,0.18), 0 1px 4px rgba(0,0,0,0.06);
}
.match-card.played { opacity: 0.5; }

.teams { display: flex; flex-direction: column; gap: 12px; }
.team-row { display: flex; align-items: center; gap: 12px; }
.team-badge {
  width: 44px; height: 44px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 13px; color: #fff;
  flex-shrink: 0;
  text-shadow: 0 1px 2px rgba(0,0,0,0.2);
}
.team-badge.tct-badge {
  background: var(--black) !important;
  box-shadow: 0 0 0 3px var(--gold);
}
.team-info { flex: 1; min-width: 0; }
.team-name { font-size: 14px; font-weight: 600; color: var(--text); line-height: 1.3; }
.team-name.is-tct { color: var(--black); font-weight: 800; }
.ha-badge {
  font-size: 10px; font-weight: 700; color: var(--text3);
  background: #f0f0f0; padding: 2px 7px; border-radius: 4px;
  margin-left: 6px; vertical-align: middle;
}
.ha-badge.home { background: var(--gold-pale); color: #9a7b00; }

.score-placeholder {
  font-size: 28px; font-weight: 800; color: #ddd; min-width: 40px; text-align: right;
}

.divider { height: 1px; background: var(--border); margin: 14px 0; }

.match-meta {
  display: flex; flex-direction: column; gap: 5px;
  font-size: 12px; color: var(--text2);
}
.match-meta .row { display: flex; align-items: flex-start; gap: 8px; }
.match-meta .icon { width: 16px; text-align: center; flex-shrink: 0; color: var(--text3); }
.match-meta a { color: var(--black); text-decoration: none; font-weight: 500; }
.match-meta a:hover { text-decoration: underline; color: #9a7b00; }

.match-footer {
  display: flex; align-items: center; justify-content: space-between;
  margin-top: 10px;
}

.status-badge {
  display: inline-block;
  font-size: 11px; font-weight: 700;
  padding: 4px 12px;
  border-radius: 20px;
}
.status-badge.upcoming { background: #f0f0f0; color: var(--text3); }
.status-badge.this-week { background: var(--gold-pale); color: #9a7b00; }
.status-badge.today {
  background: var(--gold); color: var(--black);
  animation: pulse 2s infinite;
}
.status-badge.played { background: #f5f5f5; color: #bbb; }

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.6; }
}

.cal-btn {
  font-size: 11px; font-weight: 700; color: var(--black);
  background: var(--gold);
  padding: 5px 12px; border-radius: 12px;
  text-decoration: none; cursor: pointer; border: none;
  transition: all 0.15s;
}
.cal-btn:hover { background: var(--gold-light); }

/* ── Bye cards ── */
.bye-card {
  background: var(--card);
  border-radius: 14px;
  padding: 14px 18px;
  margin-bottom: 12px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  display: flex; align-items: center; gap: 14px;
  border-left: 5px solid transparent;
}
.bye-card.tct-game { border-left-color: var(--gold); }
.bye-card .team-badge { width: 36px; height: 36px; font-size: 11px; }
.bye-card .bye-text { font-size: 13px; color: var(--text3); }
.bye-card .bye-text strong { color: var(--text); }
.bye-card .bye-label {
  font-size: 11px; font-weight: 700; color: #999;
  background: #f0f0f0; padding: 3px 10px; border-radius: 12px;
  margin-left: auto;
}

/* ── Round nav ── */
.round-nav {
  display: flex; gap: 6px; padding: 12px 0; overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.round-nav::-webkit-scrollbar { display: none; }
.round-pill {
  padding: 7px 14px; border-radius: 20px; font-size: 12px; font-weight: 700;
  white-space: nowrap; cursor: pointer; border: 2px solid var(--border);
  color: var(--text2); background: #fff; transition: all 0.2s;
  user-select: none;
}
.round-pill.active {
  background: var(--black); color: var(--gold); border-color: var(--black);
}
.round-pill:hover { border-color: var(--black); }
.round-pill.next {
  border-color: var(--gold); color: #9a7b00; background: var(--gold-pale);
}
.round-pill.next.active { background: var(--black); color: var(--gold); border-color: var(--black); }
.round-pill.past { opacity: 0.45; }
.hidden { display: none; }

/* ── Empty state ── */
.empty-state {
  text-align: center; padding: 40px 20px; color: var(--text3);
  font-size: 14px;
}

@media (min-width: 600px) {
  .content { padding: 0 20px 40px; }
  .filter-bar { padding: 12px 20px 0; }
}
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <h1>Tweed Coast Tigers</h1>
    <div class="sub">U15 Boys &middot; SEQJ 2026</div>
  </div>
  <div class="tabs">
    <div class="tab active" onclick="switchDiv('div1')">Division 1</div>
    <div class="tab" onclick="switchDiv('div3')">Division 3 GC/NR</div>
  </div>
</div>

<div id="nextBanner" class="next-banner"></div>

<div class="filter-bar">
  <div class="tct-toggle" id="tctToggle" onclick="toggleTCT()">
    <span class="dot"></span> TCT games only
  </div>
</div>

<div class="content">
  <div class="round-nav" id="roundNav"></div>
  <div id="fixtures"></div>
</div>

<script>
const MY_TEAM = "Tweed Coast Tigers";

const TEAM_COLORS = {
  "Burleigh Bombers": "#1a1a1a",
  "Coomera Magpies": "#222",
  "Broadbeach Cats": "#1a3f7a",
  "Coorparoo Roos": "#6B1530",
  "Aspley Hornets": "#c8a800",
  "Sherwood Magpies": "#333",
  "Labrador Tigers": "#c8960a",
  "Tweed Coast Tigers": "#1a1a1a",
  "Palm Beach Currumbin": "#b52025",
  "Morningside Panthers": "#5a1a2e",
  "Wilston Grange Gorillas": "#2a6b3a",
  "Maroochy Roos Juniors": "#7a1a1a",
  "Surfers Paradise Demons": "#cc1122",
  "Ormeau Bulldogs": "#003da5",
  "Pac Power": "#1a3366",
  "Byron - Ballina": "#5b2c6f"
};

const TEAM_ABBREV = {
  "Burleigh Bombers": "BB",
  "Coomera Magpies": "CM",
  "Broadbeach Cats": "BC",
  "Coorparoo Roos": "CR",
  "Aspley Hornets": "AH",
  "Sherwood Magpies": "SM",
  "Labrador Tigers": "LT",
  "Tweed Coast Tigers": "TCT",
  "Palm Beach Currumbin": "PBC",
  "Morningside Panthers": "MP",
  "Wilston Grange Gorillas": "WGG",
  "Maroochy Roos Juniors": "MR",
  "Surfers Paradise Demons": "SPD",
  "Ormeau Bulldogs": "OB",
  "Pac Power": "PP",
  "Byron - Ballina": "BB"
};

function parseTeamName(fullName) {
  return fullName.replace(/\s*U15 Boys (Division \d|Div \d).*$/, '').trim();
}

function parseCSV(text) {
  const lines = text.trim().split('\n');
  const games = [];
  for (let i = 1; i < lines.length; i++) {
    const cols = [];
    let current = '';
    let inQuotes = false;
    for (const ch of lines[i]) {
      if (ch === '"') { inQuotes = !inQuotes; }
      else if (ch === ',' && !inQuotes) { cols.push(current); current = ''; }
      else { current += ch; }
    }
    cols.push(current);
    if (cols.length < 11) continue;
    const home = cols[6].trim();
    const away = cols[7].trim();
    const isBye = away === 'BYE' || home === 'BYE';
    games.push({
      round: parseInt(cols[5]),
      roundDate: cols[4].trim(),
      homeRaw: home,
      awayRaw: away,
      home: parseTeamName(home),
      away: isBye ? 'BYE' : parseTeamName(away),
      venue: cols[8] ? cols[8].trim() : '',
      surface: cols[9] ? cols[9].trim() : '',
      gameDate: cols[10] ? cols[10].trim() : '',
      gameTime: cols[11] ? cols[11].trim() : '',
      isBye: isBye
    });
  }
  return games;
}

function parseDate(dateStr) {
  const [d, m, y] = dateStr.split('/');
  return new Date(y, m - 1, d);
}

function formatDate(dateStr) {
  const [d, m, y] = dateStr.split('/');
  const dt = new Date(y, m - 1, d);
  const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  return `${days[dt.getDay()]}, ${parseInt(d)} ${months[dt.getMonth()]}`;
}

function formatTime(timeStr) {
  if (!timeStr) return '';
  return timeStr.replace(/^0/, '');
}

function getGameStatus(dateStr) {
  const today = new Date();
  today.setHours(0,0,0,0);
  const gd = parseDate(dateStr);
  gd.setHours(0,0,0,0);
  const diff = (gd - today) / (1000 * 60 * 60 * 24);
  if (diff < 0) return 'played';
  if (diff === 0) return 'today';
  if (diff <= 6) return 'this-week';
  return 'upcoming';
}

function statusLabel(status) {
  if (status === 'played') return 'Played';
  if (status === 'today') return 'Game Day!';
  if (status === 'this-week') return 'This Week';
  return 'Upcoming';
}

function isTCTGame(g) {
  return g.home === MY_TEAM || g.away === MY_TEAM;
}

function mapsUrl(venue, surface) {
  const q = encodeURIComponent((surface && surface !== venue ? surface + ', ' : '') + venue + ', QLD, Australia');
  return `https://maps.google.com/?q=${q}`;
}

function calendarUrl(g) {
  if (!g.gameDate || !g.gameTime) return null;
  const [d, m, y] = g.gameDate.split('/');
  const time = g.gameTime.replace(/\s/g, '');
  const match = time.match(/^(\d{1,2}):(\d{2})(AM|PM)$/i);
  if (!match) return null;
  let h = parseInt(match[1]);
  const min = match[2];
  const ampm = match[3].toUpperCase();
  if (ampm === 'PM' && h !== 12) h += 12;
  if (ampm === 'AM' && h === 12) h = 0;
  const hh = String(h).padStart(2, '0');
  // AEST = UTC+10
  const startUTC = `${y}${m}${d}T${hh}${min}00`;
  const endH = String(h + 2).padStart(2, '0');
  const endUTC = `${y}${m}${d}T${endH}${min}00`;
  const title = encodeURIComponent(`${g.home} vs ${g.away} – U15 Boys`);
  const loc = encodeURIComponent(g.surface && g.surface !== g.venue ? `${g.surface}, ${g.venue}` : g.venue);
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${startUTC}/${endUTC}&location=${loc}&ctz=Australia/Brisbane`;
}

function teamBadge(name, size) {
  const color = TEAM_COLORS[name] || '#888';
  const abbr = TEAM_ABBREV[name] || name.substring(0, 2).toUpperCase();
  const sz = size || 44;
  const fs = sz < 40 ? 10 : 13;
  const isTCT = name === MY_TEAM;
  const cls = isTCT ? 'team-badge tct-badge' : 'team-badge';
  const tctColor = isTCT ? '#FFC629' : '#fff';
  return `<div class="${cls}" style="width:${sz}px;height:${sz}px;background:${color};font-size:${fs}px;color:${tctColor};">${abbr}</div>`;
}

function renderNextBanner() {
  const allGames = [...div1Games, ...div3Games];
  const today = new Date();
  today.setHours(0,0,0,0);
  let next = null;
  for (const g of allGames) {
    if (!isTCTGame(g) || g.isBye || !g.gameDate) continue;
    const gd = parseDate(g.gameDate);
    gd.setHours(0,0,0,0);
    if (gd >= today) {
      if (!next || gd < parseDate(next.gameDate)) next = g;
    }
  }
  const banner = document.getElementById('nextBanner');
  if (!next) {
    banner.style.display = 'none';
    return;
  }
  const gd = parseDate(next.gameDate);
  const diff = Math.round((gd - today) / (1000 * 60 * 60 * 24));
  const opp = next.home === MY_TEAM ? next.away : next.home;
  const ha = next.home === MY_TEAM ? 'Home' : 'Away';
  let when;
  if (diff === 0) when = 'Today!';
  else if (diff === 1) when = 'Tomorrow';
  else when = `${diff} days away`;
  banner.innerHTML = `
    <div class="label">Next TCT Game &middot; ${when}</div>
    <div class="detail">${ha} vs ${opp}</div>
    <div class="meta">${formatTime(next.gameTime)}, ${formatDate(next.gameDate)} &middot; ${next.surface || next.venue}</div>
  `;
}

function renderFixtures(games, targetRound) {
  const container = document.getElementById('fixtures');
  const rounds = {};
  games.forEach(g => {
    if (!rounds[g.round]) rounds[g.round] = { date: g.roundDate, games: [] };
    rounds[g.round].games.push(g);
  });

  const roundNums = Object.keys(rounds).map(Number).sort((a, b) => a - b);
  const nav = document.getElementById('roundNav');
  const today = new Date();
  today.setHours(0,0,0,0);

  let nextRound = null;
  for (const rn of roundNums) {
    const rd = parseDate(rounds[rn].date);
    if (rd >= today) { nextRound = rn; break; }
  }

  const showRound = targetRound || nextRound || roundNums[0];

  nav.innerHTML = roundNums.map(rn => {
    const rd = parseDate(rounds[rn].date);
    const isPast = rd < today;
    const isNext = rn === nextRound && rn !== showRound;
    let cls = 'round-pill';
    if (rn === showRound) cls += ' active';
    else if (isNext) cls += ' next';
    if (isPast && rn !== showRound) cls += ' past';
    return `<div class="${cls}" onclick="showRound(${rn})">R${rn}</div>`;
  }).join('');

  setTimeout(() => {
    const active = nav.querySelector('.active');
    if (active) active.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
  }, 50);

  const r = rounds[showRound];
  if (!r) { container.innerHTML = '<div class="empty-state">No fixtures found.</div>'; return; }

  let matches = r.games.filter(g => !g.isBye).sort((a, b) => (a.gameTime || '').localeCompare(b.gameTime || ''));
  let byes = r.games.filter(g => g.isBye);

  if (tctOnly) {
    matches = matches.filter(g => isTCTGame(g));
    byes = byes.filter(g => { const t = g.home === 'BYE' ? g.away : g.home; return t === MY_TEAM; });
  }

  if (matches.length === 0 && byes.length === 0) {
    container.innerHTML = `<div class="round-header"><h2>Round ${showRound}</h2><div class="date">${formatDate(r.date)}</div></div><div class="empty-state">No TCT games this round</div>`;
    return;
  }

  let html = `<div class="round-header"><h2>Round ${showRound}</h2><div class="date">${formatDate(r.date)}</div></div>`;

  matches.forEach(g => {
    const [d, m, y] = g.gameDate.split('/');
    const gd = new Date(y, m - 1, d);
    const dayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const monNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const dateLabel = `${formatTime(g.gameTime)}, ${dayNames[gd.getDay()]}, ${parseInt(d)} ${monNames[gd.getMonth()]}`;
    const tct = isTCTGame(g);
    const status = getGameStatus(g.gameDate);
    const calUrl = calendarUrl(g);
    const homeIsTCT = g.home === MY_TEAM;
    const awayIsTCT = g.away === MY_TEAM;

    html += `
    <div class="match-card${tct ? ' tct-game' : ''}${status === 'played' ? ' played' : ''}">
      <div class="teams">
        <div class="team-row">
          ${teamBadge(g.home)}
          <div class="team-info">
            <div class="team-name${homeIsTCT ? ' is-tct' : ''}">${g.home}<span class="ha-badge home">H</span></div>
          </div>
          <div class="score-placeholder">&ndash;</div>
        </div>
        <div class="team-row">
          ${teamBadge(g.away)}
          <div class="team-info">
            <div class="team-name${awayIsTCT ? ' is-tct' : ''}">${g.away}<span class="ha-badge">A</span></div>
          </div>
          <div class="score-placeholder">&ndash;</div>
        </div>
      </div>
      <div class="divider"></div>
      <div class="match-meta">
        <div class="row"><span class="icon">&#128197;</span> ${dateLabel}</div>
        <div class="row"><span class="icon">&#128205;</span> <a href="${mapsUrl(g.venue, g.surface)}" target="_blank" rel="noopener">${g.venue}${g.surface && g.surface !== g.venue ? ', ' + g.surface : ''}</a></div>
      </div>
      <div class="match-footer">
        <span class="status-badge ${status}">${statusLabel(status)}</span>
        ${calUrl && status !== 'played' ? `<a class="cal-btn" href="${calUrl}" target="_blank" rel="noopener">+ Calendar</a>` : ''}
      </div>
    </div>`;
  });

  byes.forEach(g => {
    const byeTeam = g.home === 'BYE' ? g.away : g.home;
    const tct = byeTeam === MY_TEAM;
    html += `
    <div class="bye-card${tct ? ' tct-game' : ''}">
      ${teamBadge(byeTeam, 36)}
      <div class="bye-text"><strong>${byeTeam}</strong></div>
      <div class="bye-label">BYE</div>
    </div>`;
  });

  container.innerHTML = html;
}

// CSV data embedded
