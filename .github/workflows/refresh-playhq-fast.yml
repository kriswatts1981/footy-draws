name: Refresh PlayHQ (fast)

on:
  schedule:
    # Weekends (game days): every 15 min
    - cron: '*/15 * * * 6,0'
    # Weekdays: every hour
    - cron: '5 * * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-playhq-fast
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Snapshot fixture state BEFORE refresh
        run: cp data/fixture.json /tmp/fixture-before.json

      - name: Fetch PlayHQ (fast)
        env:
          PLAYHQ_API_KEY: ${{ secrets.PLAYHQ_API_KEY }}
        working-directory: scripts
        run: python3 fetch_playhq_fast.py

      - name: Detect new rounds in Div 1 or Div 3
        id: detect
        run: |
          python3 - <<'PY'
          import json, os
          before = json.load(open('/tmp/fixture-before.json'))
          after = json.load(open('data/fixture.json'))
          summary_lines = []
          new_found = False
          for div in ('div1', 'div3'):
              b_rounds = {g.get('round') for g in (before.get('divisions',{}).get(div,{}).get('games',[]) or [])}
              a_rounds = {g.get('round') for g in (after.get('divisions',{}).get(div,{}).get('games',[]) or [])}
              new_rounds = sorted(a_rounds - b_rounds)
              if new_rounds:
                  new_found = True
                  div_label = 'Div 1' if div == 'div1' else 'Div 3'
                  for r in new_rounds:
                      games = [g for g in after['divisions'][div]['games'] if g.get('round') == r]
                      first = sorted(games, key=lambda g: g.get('date') or '')[0] if games else None
                      first_str = ''
                      if first:
                          first_str = f" — first game {first.get('date','?')} {first.get('home_team','?')} v {first.get('away_team','?')}"
                      summary_lines.append(f"{div_label}: {r} ({len(games)} games){first_str}")
          gh_out = os.environ['GITHUB_OUTPUT']
          with open(gh_out, 'a') as f:
              f.write(f"new_rounds={'true' if new_found else 'false'}\n")
              f.write("summary<<EOF\n")
              f.write("\n".join(summary_lines) if summary_lines else "(no new rounds)")
              f.write("\nEOF\n")
          if new_found:
              print("NEW ROUNDS DETECTED:")
              for s in summary_lines:
                  print(f"  {s}")
          else:
              print("No new rounds.")
          PY

      - name: Email Kris if new rounds appeared
        if: steps.detect.outputs.new_rounds == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          from: Footy Watcher <${{ secrets.SMTP_USER }}>
          to: kriswatts@gmail.com
          subject: "Footy: new fixtures published on PlayHQ"
          body: |
            New fixtures appeared on PlayHQ for the TCT U15 Boys draw.

            ${{ steps.detect.outputs.summary }}

            Site: https://kriswatts1981.github.io/footy-draws

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fixture.json data/ladder.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "data: fast refresh ($(date -u +%Y-%m-%dT%H:%MZ))"
            for attempt in 1 2 3; do
              git pull --rebase -X theirs origin main && git push && break
              echo "Push attempt $attempt failed; rebasing again..."
              git rebase --abort 2>/dev/null || true
              sleep $((attempt * 5))
            done
          fi

      - name: Email Kris on failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          from: Footy Watcher <${{ secrets.SMTP_USER }}>
          to: kriswatts@gmail.com
          subject: "FOOTY-DRAWS FAILED: Refresh PlayHQ (fast)"
          body: |
            The fast PlayHQ refresh failed.

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Trigger: ${{ github.event_name }}

            Fixture/ladder may be stale until next run (every 15 min on game days).
