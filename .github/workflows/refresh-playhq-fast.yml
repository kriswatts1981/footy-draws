name: Refresh PlayHQ (fast)

on:
  schedule:
    # Weekends (game days): every 15 min
    - cron: '*/15 * * * 6,0'
    # Weekdays: every hour
    - cron: '5 * * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-playhq-fast
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch PlayHQ (fast)
        env:
          PLAYHQ_API_KEY: ${{ secrets.PLAYHQ_API_KEY }}
        working-directory: scripts
        run: python3 fetch_playhq_fast.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add data/fixture.json data/ladder.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "data: fast refresh ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          fi
