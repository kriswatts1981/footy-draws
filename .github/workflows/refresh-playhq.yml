name: Refresh PlayHQ data

on:
  schedule:
    # Daily — refreshes players.json (player career stats).
    - cron: '15 14 * * *'  # 14:15 UTC = 00:15 AEST (post-midnight)
    # Post-game weekend evenings (Sat=6, Sun=0 in cron). Game counts
    # for the day's matches usually land on PlayHQ within a few hours.
    - cron: '0 10 * * 6,0'  # 10:00 UTC = 20:00 AEST
    - cron: '0 12 * * 6,0'  # 12:00 UTC = 22:00 AEST (safety net)
  workflow_dispatch:
    inputs:
      refetch_all:
        description: 'Force re-fetch of all cached seasons'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh-playhq
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch PlayHQ data
        env:
          PLAYHQ_API_KEY: ${{ secrets.PLAYHQ_API_KEY }}
          PLAYHQ_REFETCH_ALL: ${{ inputs.refetch_all && '1' || '0' }}
        run: python3 scripts/fetch_playhq.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "data: refresh PlayHQ ($(date -u +%Y-%m-%dT%H:%MZ))"
            # Slow refresh takes ~38 min; fast refresh can land during the window
            # and cause merge conflicts on data/*.json. Prefer OUR comprehensive
            # data when conflicts arise (rebase: -X theirs = the commit being replayed).
            for attempt in 1 2 3; do
              git pull --rebase -X theirs origin main && git push && break
              echo "Push attempt $attempt failed; rebasing again..."
              git rebase --abort 2>/dev/null || true
              sleep $((attempt * 5))
            done
          fi

      - name: Email Kris on failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          from: Footy Watcher <${{ secrets.SMTP_USER }}>
          to: kriswatts@gmail.com
          subject: "FOOTY-DRAWS FAILED: Refresh PlayHQ data (slow)"
          body: |
            The daily slow PlayHQ refresh failed.

            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Trigger: ${{ github.event_name }}
            Started: ${{ github.event.head_commit.timestamp }}

            Game counts on the squad page may be stale until next run.
